<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <defs>
    <linearGradient id="barRaw" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#475569"/>
      <stop offset="1" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="barCtx" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#6D28D9"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="#0B1220"/>
  <rect width="1200" height="6" fill="#8B5CF6"/>

  <!-- header -->
  <rect x="48" y="48" width="44" height="44" rx="10" fill="#8B5CF6"/>
  <text x="70" y="77" text-anchor="middle" fill="#ffffff" font-size="26" font-weight="800" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">d</text>
  <text x="108" y="77" fill="#E2E8F0" font-size="26" font-weight="700" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">dizz</text>
  <text x="1152" y="76" text-anchor="end" fill="#64748B" font-size="15" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">measured, not promised</text>

  <!-- title -->
  <text x="48" y="152" fill="#F8FAFC" font-size="40" font-weight="800" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Same project. One distilled read.</text>
  <text x="48" y="188" fill="#94A3B8" font-size="19" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">How dizz actually performed in its own e2e benchmark</text>

  <!-- LEFT card: distillation -->
  <rect x="48" y="220" width="540" height="340" rx="16" fill="#111A2E" stroke="#1E293B" stroke-width="1.5"/>
  <text x="76" y="258" fill="#F8FAFC" font-size="22" font-weight="700" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">What an agent reads</text>
  <text x="76" y="286" fill="#94A3B8" font-size="16" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">to understand the project</text>

  <text x="76" y="330" fill="#CBD5E1" font-size="17" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Raw dizz state files</text>
  <text x="560" y="330" text-anchor="end" fill="#E2E8F0" font-size="18" font-weight="700" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">153.9 KB</text>
  <rect x="76" y="342" width="484" height="18" rx="4" fill="url(#barRaw)"/>

  <text x="76" y="390" fill="#CBD5E1" font-size="17" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">dizz context (TON)</text>
  <text x="560" y="390" text-anchor="end" fill="#A78BFA" font-size="18" font-weight="700" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">2.2 KB</text>
  <rect x="76" y="402" width="484" height="18" rx="4" fill="url(#barCtx)"/>

  <circle cx="80" cy="448" r="5" fill="#34D399"/>
  <text x="96" y="454" fill="#CBD5E1" font-size="17" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">68x less to read - about 560 tokens</text>
  <circle cx="80" cy="484" r="5" fill="#34D399"/>
  <text x="96" y="490" fill="#CBD5E1" font-size="17" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">One command, same information, distilled</text>

  <!-- RIGHT card: evidence -->
  <rect x="612" y="220" width="540" height="340" rx="16" fill="#111A2E" stroke="#1E293B" stroke-width="1.5"/>
  <text x="640" y="258" fill="#F8FAFC" font-size="22" font-weight="700" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">In a real benchmark</text>
  <text x="640" y="286" fill="#94A3B8" font-size="16" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">agents used dizz on their own</text>

  <text x="640" y="368" fill="#34D399" font-size="58" font-weight="800" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">5/5</text>
  <text x="640" y="398" fill="#CBD5E1" font-size="17" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">tasks passed every session</text>
  <text x="640" y="420" fill="#64748B" font-size="15" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">with dizz 5/5 - without dizz 5/5</text>

  <text x="884" y="368" fill="#A78BFA" font-size="58" font-weight="800" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">60%</text>
  <text x="884" y="398" fill="#CBD5E1" font-size="17" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">of sessions used dizz</text>
  <text x="884" y="420" fill="#64748B" font-size="15" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">unprompted, up to 5/5 at the end</text>

  <text x="640" y="500" fill="#64748B" font-size="14" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">opencode - taskforge seed - skill mode - 5 runs per cell</text>

  <!-- footer -->
  <text x="48" y="596" fill="#64748B" font-size="14" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Source: dizz e2e benchmark - opencode on the taskforge seed project, skill mode, 5 runs per cell.</text>
  <text x="48" y="620" fill="#64748B" font-size="14" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Context sizes: TestAgentContextEfficiency on the dizz codebase (804 symbols).</text>
</svg>
